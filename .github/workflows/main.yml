name: Build GlitchVisual

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -q GlitchVisual-PS5-Menu-1.21.11-phone-build.zip -d project
          find project -name build.gradle -print

      - name: Build mod
        run: |
          cd project
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GlitchVisual-JAR
          path: project/**/build/libs/*.jar
          if-no-files-found: error
